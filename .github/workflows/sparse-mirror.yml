name: HW0 sparse mirror parity and performance
on:
  push:
    branches:
      - 'feat/hw0-bptt-performance'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Check cached forward/inverse scattering against dense native oracle
        run: |
          ${{ matrix.compiler }} -Iinclude -O3 -std=c++20 -Wall -Wextra -Wpedantic -Werror tests/test_sparse_wave.cpp -o /tmp/test_sparse_wave
          /tmp/test_sparse_wave | tee mirror-parity.log
          grep -F 'PASS: cached sparse T and T* equal dense' mirror-parity.log
