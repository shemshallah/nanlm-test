name: HW0 temporal-credit causal reload parity
on:
  push:
    branches: ['fix/temporal-credit-causal-replay-20261110']
  pull_request:
    paths:
      - 'tests/test_temporal_credit.cpp'
      - '.github/workflows/temporal-credit-causal-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile native 48-step causal root-reload regression
        run: |
          set -euo pipefail
          ${{ matrix.compiler }} -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/test_temporal_credit.cpp -o causal_reload_test
      - name: Prove physically identical predictions after replay
        run: |
          ./causal_reload_test 2>&1 | tee result.txt
          grep -F 'PASS: 48-step causal eligibility credit' result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: causal-replay-${{ matrix.compiler }}
          path: result.txt
          if-no-files-found: ignore
