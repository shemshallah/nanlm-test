name: HW0 autoregressive language and generation audit
on:
  push:
    branches:
      - feat/hw0-autoregressive-byte-model
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  byte-generation:
    name: "Causal text model (${{ matrix.compiler }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile language model and regression suite
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make nanlm test_byte_model CXX="${{ matrix.compiler }}"
          ./test_byte_model | tee byte-model-audit.log
          grep 'PASS: variable-order causal autoregression' byte-model-audit.log
      - name: Test real CLI with unseen text and deterministic sampling
        shell: bash
        run: |
          set -euo pipefail
          printf 'the little model can generate tiny pieces of text.\nthe little model can learn the recurring words.\n' > /tmp/hw0-train.txt
          printf 'the little model can generate recurring text.\n' > /tmp/hw0-heldout.txt
          ./nanlm /tmp/hw0-causal-root train-text /tmp/hw0-train.txt 3 | tee train.log
          ./nanlm /tmp/hw0-causal-root eval-text /tmp/hw0-heldout.txt | tee eval.log
          ./nanlm /tmp/hw0-causal-root generate 'the little model ' 100 11 0.85 0.92 > sample-1.txt
          ./nanlm /tmp/hw0-causal-root generate 'the little model ' 100 11 0.85 0.92 > sample-2.txt
          cmp sample-1.txt sample-2.txt
          test "$(wc -c < sample-1.txt)" = 117
          test "$(stat -c%s /tmp/hw0-causal-root)" = 8388608
          cat sample-1.txt
      - name: Save audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-byte-model-${{ matrix.compiler }}
          path: |
            byte-model-audit.log
            train.log
            eval.log
            sample-1.txt
          if-no-files-found: warn
